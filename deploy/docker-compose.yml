name: deepseek-api-chat

services:
  # PostgreSQL：会话、消息与账号的唯一真相源；数据放命名卷持久化
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deepseekchat}
      POSTGRES_USER: ${POSTGRES_USER:-deepseekchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 deploy/.env 中设置 POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-deepseekchat} -d ${POSTGRES_DB:-deepseekchat}']
      interval: 10s
      timeout: 5s
      retries: 10

  # 应用：同源提供前端静态文件与 /api（含流式 /api/sessions/:id/turns）
  app:
    # 两条路选一条：
    # A. 本机构建（默认）——需要 2 GB 以上内存 + swap，否则 tsc / rspack 会被 OOM 杀掉
    # B. 用 CI 构建好的镜像——把下面 image: 那一行的注释去掉即可（build: 可以保留：
    #    docker compose pull app 拉镜像；up 时本地已有镜像就不会再构建）
    #    镜像由 .github/workflows/docker.yml 在 push 到 main 时自动构建并推到 GHCR
    # image: ${APP_IMAGE:-ghcr.io/siyin67/deepseek-api-chat:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgres://${POSTGRES_USER:-deepseekchat}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-deepseekchat}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      # 模型 Key 的加密主密钥：只在服务端使用，丢失后已保存的 Key 无法解密
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?请先执行 openssl rand -base64 32 并写入 deploy/.env}
      AUTH_TOKEN_TTL_DAYS: ${AUTH_TOKEN_TTL_DAYS:-30}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      # 注册口令（首次启动写入数据库）；留空则随机生成并打印在启动日志里
      REGISTRATION_CODE: ${REGISTRATION_CODE:-}
      # 可选的服务端兜底 Key：用户没自设 Key 时使用，接口只返回掩码
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE:-https://api.deepseek.com}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-600000}
      CONTEXT_TOKEN_BUDGET: ${CONTEXT_TOKEN_BUDGET:-120000}
      SESSION_PAGE_SIZE: ${SESSION_PAGE_SIZE:-30}
      MESSAGE_PAGE_SIZE: ${MESSAGE_PAGE_SIZE:-30}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-64}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      TRUST_PROXY: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # 只映射到宿主机回环：由宿主机上的 Nginx 反代，公网不直接访问应用端口。
      # 换端口改 APP_PORT 即可（Nginx upstream 也要跟着改）。
      - '127.0.0.1:${APP_PORT:-3000}:3000'

  # 可选：Caddy 容器（COMPOSE_PROFILES=caddy 时才启动）。
  # 默认不启动任何代理容器 —— 由宿主机 Nginx 承担反向代理与 HTTPS 终止。
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ['caddy']
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      # 域名（如 chat.example.com）即自动申请证书；留空或写 :80 时只提供 HTTP
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:

# 反向代理：只监听 80 的版本（首次部署、内网、或先用 HTTP 跑通）。
# 用法：deploy/.env 里设置
#   COMPOSE_PROFILES=nginx
#   NGINX_CONF=http-only.conf
# 然后把本文件挂载到容器的 /etc/nginx/conf.d/default.conf。
#
# 拿到证书后改用 with-tls.conf：
#   1. 把 with-tls.conf 里的 chat.example.com（共 4 处）改成你的域名
#   2. .env 里 NGINX_CONF=with-tls.conf
#   3. docker compose up -d nginx && docker compose exec nginx nginx -t

# 与应用容器保持长连接，减少每帧新建连接的开销
upstream app_backend {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;

    # 附件上传上限：必须 ≥ MAX_UPLOAD_MB（默认 64MB），再留出 multipart 开销
    client_max_body_size 80m;

    # certbot --webroot 校验目录（续期同样走这里，不要删）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # 聊天流式接口 + 文件/语音上传下载：不缓冲、不压缩、长超时。
    # 这是整份配置里最关键的段落，改动会导致回复变成「一次吐出」或长回答中途断开。
    location /api/ {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 清空 Connection 才能让 upstream keepalive 生效，且保持 chunked 透传
        proxy_set_header Connection "";

        proxy_buffering off;          # 不攒缓冲区，收到一块转发一块
        proxy_request_buffering off;  # 上传边收边转，不先落盘
        proxy_cache off;
        gzip off;                     # 流式响应绝不能压缩

        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;     # ≥ UPSTREAM_TIMEOUT_MS（默认 600s），留足长回答
        proxy_send_timeout 3600s;
        send_timeout 3600s;
    }

    # 前端静态资源与 SPA 回退由应用自身托管（同一容器，无跨域）
    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout 60s;

        # 静态资源压缩收益明显；/api 已在上面 gzip off
        gzip on;
        gzip_proxied any;
        gzip_min_length 1024;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    }
}

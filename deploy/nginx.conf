# 宿主机 Nginx 反向代理配置（容器里不跑 Nginx，只把应用端口映射到宿主机回环）
#
# 用法：
#   1. docker compose up -d 之后，应用监听在 127.0.0.1:3000（见 APP_PORT）
#   2. sudo cp nginx.conf /etc/nginx/conf.d/deepseek-api-chat.conf
#   3. 把下面的 chat.example.com 全部换成你的域名（共 5 处），证书路径按实际情况改
#   4. sudo nginx -t && sudo nginx -s reload
#
# 已有 HTTPS 站点：只需要把下面 443 server 块里的 location /api/ 和 location / 两段
# 拷进现有 server 块，其余（证书、http2、listen）沿用你原来的配置。
#
# 还没证书：先只拷 80 端口的 server 块，并把 location / 里的 return 301 换成
# proxy_pass http://deepseek_api_chat; 跑通后再申请证书切到 443。

upstream deepseek_api_chat {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP：只做 ACME 校验与跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name chat.example.com;

    server_tokens off;

    # certbot --webroot -w /var/www/certbot 会往这个目录写校验文件
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                       # nginx ≥ 1.25.1；更老版本写成 listen 443 ssl http2;
    server_name chat.example.com;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 附件上传上限：要 ≥ MAX_UPLOAD_MB（默认 64MB，这里给 80m 余量）
    client_max_body_size 80m;

    # 流式接口：聊天回复（SSE）与语音合成都走这里
    # 关键四条：关缓冲、关压缩、抬高读超时、用 HTTP/1.1 + 空 Connection 保持 chunked 透传
    location /api/ {
        proxy_pass http://deepseek_api_chat;

        proxy_http_version 1.1;
        proxy_set_header Connection "";          # 清掉 close，保持上游 keepalive 与 chunked 透传
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;                     # 不攒响应，收到即转发
        proxy_request_buffering off;             # 上传边收边转
        proxy_cache off;
        gzip off;                                # 压缩会攒块，导致整段延迟输出

        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;                # ≥ UPSTREAM_TIMEOUT_MS（默认 600s）
        proxy_send_timeout 3600s;
        send_timeout 3600s;
    }

    # 前端静态资源与 SPA 回退（由应用进程托管 dist/）
    location / {
        proxy_pass http://deepseek_api_chat;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        gzip on;                                 # 静态资源压缩收益高，且不影响流式接口
        gzip_types text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1024;

        proxy_read_timeout 60s;
    }
}

# 反向代理：HTTPS 版本（证书就绪后使用）。
# 用法：deploy/.env 里设置
#   COMPOSE_PROFILES=nginx
#   NGINX_CONF=with-tls.conf
#
# 使用前把下面的 chat.example.com 全部替换成你的域名（共 4 处：80 跳转 1 处、
# 443 的 server_name 1 处、证书路径 2 处），证书由 certbot 写入共享卷 /etc/letsencrypt：
#   docker compose run --rm --entrypoint certbot certbot certonly \
#     --webroot -w /var/www/certbot -d chat.example.com \
#     -m you@example.com --agree-tos --no-eff-email
# 之后：
#   docker compose exec nginx nginx -t && docker compose exec nginx nginx -s reload

upstream app_backend {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name chat.example.com;

    server_tokens off;

    # 证书校验走 80，不能被跳转掉
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx ≥ 1.25.1 的新写法；更老的版本把 http2 写进 listen：listen 443 ssl http2;
    http2 on;
    server_name chat.example.com;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # 附件上传上限：必须 ≥ MAX_UPLOAD_MB（默认 64MB），再留出 multipart 开销
    client_max_body_size 80m;

    # 聊天流式接口 + 文件/语音上传下载：不缓冲、不压缩、长超时。
    # 这是整份配置里最关键的段落，改动会导致回复变成「一次吐出」或长回答中途断开。
    location /api/ {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 清空 Connection 才能让 upstream keepalive 生效，且保持 chunked 透传
        proxy_set_header Connection "";

        proxy_buffering off;          # 不攒缓冲区，收到一块转发一块
        proxy_request_buffering off;  # 上传边收边转，不先落盘
        proxy_cache off;
        gzip off;                     # 流式响应绝不能压缩

        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;     # ≥ UPSTREAM_TIMEOUT_MS（默认 600s），留足长回答
        proxy_send_timeout 3600s;
        send_timeout 3600s;
    }

    # 前端静态资源与 SPA 回退由应用自身托管（同一容器，无跨域）
    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout 60s;

        # 静态资源压缩收益明显；/api 已在上面 gzip off
        gzip on;
        gzip_proxied any;
        gzip_min_length 1024;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    }
}
